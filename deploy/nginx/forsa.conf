# Nginx site for Forsa on the VPS. Copy to /etc/nginx/sites-available/forsa.conf, link it into
# sites-enabled, replace forsa.example with the real domain, then `nginx -t && systemctl reload nginx`.
# The certificate lines are filled in by certbot (`certbot --nginx -d forsa.example -d www.forsa.example`).
# The Next.js process listens on 127.0.0.1:3000 (deploy/systemd/forsa-web.service).

upstream forsa_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Plain HTTP only redirects to HTTPS (certbot's challenge is handled by certbot itself).
server {
    listen 80;
    listen [::]:80;
    server_name forsa.example www.forsa.example;
    return 301 https://forsa.example$request_uri;
}

# www goes to the bare domain, one address for search engines.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.forsa.example;
    # ssl_certificate / ssl_certificate_key: added by certbot
    return 301 https://forsa.example$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name forsa.example;
    # ssl_certificate / ssl_certificate_key: added by certbot

    # Security headers (CSP, HSTS, frame and referrer rules) come from the site itself (next.config.ts),
    # so they are the same on Vercel and here. Do not add them twice.
    server_tokens off;
    client_max_body_size 25m;   # hand-in files later; the site itself sends small forms

    # Compression for text. Next.js does not compress when compress is left on and a proxy does it;
    # either is fine, Nginx is faster.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml
               application/manifest+json image/svg+xml font/ttf;

    # Built files have a content hash in their names: cache for a year.
    location /_next/static/ {
        proxy_pass http://forsa_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Share images, icons, manifest: cache for a day (names do not change when the file does).
    location ~* ^/(og/|icon\.svg|favicon\.ico|apple-icon\.png|manifest\.webmanifest) {
        proxy_pass http://forsa_web;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Health address for an uptime monitor. Not logged.
    location = /api/health {
        proxy_pass http://forsa_web;
        access_log off;
    }

    location / {
        proxy_pass http://forsa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
